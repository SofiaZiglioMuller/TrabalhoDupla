<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Cadastro</h1>
    <input type="text" placeholder="Digite seu nome" id="nome">
    <input type="email" placeholder="Digite seu email" id="email">
    <input type="tel" placeholder="Digite seu telefone" id="telefone">
    <button type="submit" id="btn">Envie seus dados</button>
    <div id="resultado"></div>

    <script>
        const nome = document.getElementById("nome")
        const email = document.getElementById("email")
        const telefone = document.getElementById("telefone")
        const btn = document.getElementById("btn")
        const resultado = document.getElementById("resultado")
        btn.addEventListener("click", function(){
            const valorNome = nome.value
            const valorEmail = email.value
            const valorTelefone = telefone.value

        resultado.innerHTML = `
                <p><strong>Dados enviados:</strong></p>
                <p>Nome: ${valorNome}</p>
                <p>E-mail: ${valorEmail}</p>
                <p>Telefone: ${valorTelefone}</p>
            `    
        })
    </script>
</body>
</html>
